name: Commit messages

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # Dependabot titles can exceed the 72 character header limit
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
